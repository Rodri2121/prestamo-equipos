spring.application.name=api-prestamos
server.port=8080

# Las variables (DB_PASSWORD, JWT_SECRET, ...) se leen del entorno o del archivo
# .env de esta carpeta. El .env NO se sube al repositorio (ver .env.example).
spring.config.import=optional:file:.env[.properties]

# --- Base de datos PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prestamos_equipos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo crean los scripts schema.sql y data.sql (src/main/resources).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
# Clave HMAC de al menos 32 caracteres. Sin valor por defecto: si falta, la app no arranca.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# --- CORS (frontend React con Vite) ---
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
