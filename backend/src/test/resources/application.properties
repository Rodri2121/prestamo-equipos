# Configuración SOLO para tests: H2 en memoria, no requiere PostgreSQL.
spring.datasource.url=jdbc:h2:mem:prestamos-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea el esquema; no se ejecutan schema.sql/data.sql (son de PostgreSQL).
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.open-in-view=false

app.jwt.secret=clave-solo-para-tests-0123456789-abcdefghij
app.jwt.expiracion-minutos=60
app.cors.origenes=http://localhost:5173
